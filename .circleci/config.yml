version: 2.1

# Ported from .github/workflows/test.yml (now removed) to reduce GitHub
# Actions minute usage. The seven Actions jobs are consolidated into three
# CircleCI jobs so each push spins up three containers instead of seven.
#
# Still on GitHub Actions (deliberately):
#   - docs.yml             GitHub Pages OIDC deploy only works from Actions;
#                          path-filtered to docs changes so it rarely runs.
#   - behavioral-evals.yml weekly schedule + manual dispatch only.
#   - release-artifacts.yml runs per release; uses the built-in GITHUB_TOKEN
#                          to upload release assets.

jobs:
  tests-and-validation:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout

      - run:
          name: Install BATS, jq, and yq
          command: |
            sudo apt-get update
            sudo apt-get install -y bats jq
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq

      - run:
          name: Install PyYAML
          command: pip install pyyaml

      - run:
          name: Run BATS tests
          command: bats tests/test-plugin.bats

      - run:
          name: Validate SKILL.md and AGENT.md frontmatter
          command: |
            chmod +x scripts/validate-frontmatter.sh
            ./scripts/validate-frontmatter.sh

      - run:
          name: Check Codex TOML / openai.yaml parity
          command: |
            chmod +x scripts/check-codex-parity.sh
            ./scripts/check-codex-parity.sh

      - run:
          name: Scan for secrets
          command: |
            # Check for potential hardcoded secrets
            # Exclude audit-security.md and audit-live-site.md which contain example security code
            if grep -ri "password\s*=\|api_key\s*=\|secret\s*=" skills/ agents/ docs/ | grep -v "example\|placeholder\|TODO\|test-fixture\|audit-security.md\|audit-live-site.md"; then
              echo "❌ Potential hardcoded secrets found"
              exit 1
            else
              echo "✅ No hardcoded secrets detected"
            fi

      - run:
          name: Check for merge conflict markers
          # The conflict markers are built with printf because a literal
          # run of < characters trips CircleCI's << pipeline-parameter parser.
          command: |
            open_marker=$(printf '<%.0s' 1 2 3 4 5 6 7)
            close_marker=$(printf '>%.0s' 1 2 3 4 5 6 7)
            if grep -r "^$open_marker \|^=======$\|^$close_marker " skills/ agents/ docs/ 2>/dev/null; then
              echo "❌ Found merge conflict markers"
              exit 1
            else
              echo "✅ No merge conflict markers found"
            fi

      - run:
          name: Validate JSON, TOML, and CI configs
          command: |
            jq empty .claude-plugin/plugin.json && echo "✅ plugin.json is valid"

            # Basic TOML validation - check file exists and has required fields
            if [ -f "zensical.toml" ] && grep -q "site_name" zensical.toml && grep -q "docs_dir" zensical.toml; then
              echo "✅ zensical.toml is valid"
            else
              echo "❌ zensical.toml missing or invalid"
              exit 1
            fi

            yq eval .circleci/config.yml > /dev/null && echo "✅ .circleci/config.yml is valid"

            for workflow in .github/workflows/*.yml; do
              echo "Validating $workflow..."
              yq eval "$workflow" > /dev/null && echo "✅ $workflow is valid"
            done

  routing-evals:
    docker:
      - image: cimg/node:20.19
    resource_class: small
    steps:
      - checkout

      - run:
          name: Run TF-IDF routing + collision evals
          # --min-rank1 is the CI floor: at least this % of eval prompts must
          # rank their expected skill #1. Raise it as descriptions improve;
          # never lower it to make a failing description "pass".
          command: node scripts/run-evals.js --min-rank1 75 --collision-threshold 0.75

  documentation-build:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout

      - restore_cache:
          keys:
            - pip-cache-v1-zensical

      - run:
          name: Install Zensical
          command: |
            python -m pip install --upgrade pip
            pip install zensical

      - save_cache:
          key: pip-cache-v1-zensical
          paths:
            - ~/.cache/pip

      - run:
          name: Build documentation
          command: zensical build --clean

      - run:
          name: Check for broken links in docs
          command: |
            # Check that all internal links resolve
            find docs -name "*.md" -exec grep -h '\[.*\](.*)' {} \; | \
              grep -o '(\([^)]*\.md\))' | \
              sed 's/[()]//g' | \
              while read link; do
                if [[ "$link" =~ ^http ]]; then
                  continue  # Skip external links
                fi
                # Remove anchors
                file=$(echo "$link" | cut -d'#' -f1)
                if [ -n "$file" ] && [ ! -f "docs/$file" ]; then
                  echo "❌ Broken link: $link"
                fi
              done

workflows:
  test:
    jobs:
      - tests-and-validation
      - routing-evals
      - documentation-build
